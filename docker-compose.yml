version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: 'rabbitmq'
    ports:
      - "5672:5672"
      - "15672:15672"

  chromadb:
    image: chromadb/chroma:0.4.15
    container_name: 'chromadb'
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/.chroma/index 

  api:
    build: .
    container_name: 'sentinela_api'
    ports:
      - "8001:8000" 
    volumes:
      - ./app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - rabbitmq
      - chromadb
    environment:
      - PYTHONPATH=/code

  worker:
    build: .
    container_name: 'sentinela_worker'
    command: ["celery", "-A", "app.celery.celery_app:celery", "worker", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      - rabbitmq
      - chromadb
    environment:
      - PYTHONPATH=/code
      
  beat:
    build: .
    container_name: 'sentinela_beat'
    command: ["celery", "-A", "app.celery.celery_app:celery", "beat", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      - rabbitmq
      - chromadb
    environment:
      - PYTHONPATH=/code