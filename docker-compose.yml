version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: 'rabbitmq'
    ports:
      - "5672:5672"   
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: 'sentinela_api'
    ports:
      - "8000:8000"
    volumes:

      - ./app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      rabbitmq:
        condition: service_healthy 
    environment:
      - PYTHONPATH=/code

  worker:
    build: .
    container_name: 'sentinela_worker'
    command: ["celery", "-A", "app.celery.celery_app:celery", "worker", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      rabbitmq:
        condition: service_healthy 
    environment:
      - PYTHONPATH=/code