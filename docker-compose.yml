version: '3.9'

services:
  # O serviço da fila de mensagens (Message Broker)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: 'rabbitmq'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sentinela_network

  # O serviço do nosso Banco de Dados Vetorial
  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: 'chromadb'
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    # Mantive o ajuste do numpy caso seja necessário forçar a versão < 2.0
    command: /bin/sh -c "pip install --no-cache-dir --force-reinstall 'numpy<2.0' && uvicorn chromadb.app:app --host 0.0.0.0 --port 8000"
    networks:
      - sentinela_network

  # O serviço do nosso Banco de Dados Relacional (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: 'postgres_db'
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=sentinela
    networks:
      - sentinela_network

  # O serviço da nossa API Web
  api:
    build: .
    container_name: 'sentinela_api'
    ports:
      - "8001:8000"
    volumes:
      - ./app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - rabbitmq
      - chromadb
      - postgres
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/sentinela
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_INSIGHTS_MODEL=${LLM_INSIGHTS_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    networks:
      - sentinela_network

  # Worker de ingestão: PostgreSQL + embedding ChromaDB (CPU-bound)
  worker:
    build: .
    container_name: 'sentinela_worker'
    command: ["celery", "-A", "app.celery.celery_app:celery", "worker",
              "--queues=ingestion", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      - rabbitmq
      - chromadb
      - postgres
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/sentinela
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    networks:
      - sentinela_network

  # Worker de IA: chamadas ao LLM (I/O-bound) — suporta Groq e Ollama local
  worker_ai:
    build: .
    container_name: 'sentinela_worker_ai'
    command: ["celery", "-A", "app.celery.celery_app:celery", "worker",
              "--queues=ai", "--concurrency=2", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      - rabbitmq
      - postgres
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/sentinela
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_INSIGHTS_MODEL=${LLM_INSIGHTS_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Mantém o modelo carregado em RAM permanentemente (evita reload de ~10s entre pedidos)
      - OLLAMA_KEEP_ALIVE=-1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    networks:
      - sentinela_network

  # O serviço do nosso Agendador
  beat:
    build: .
    container_name: 'sentinela_beat'
    command: ["celery", "-A", "app.celery.celery_app:celery", "beat", "--loglevel=info"]
    volumes:
      - ./app:/code/app
    depends_on:
      - rabbitmq
      - chromadb
      - postgres
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/sentinela
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: on-failure
    networks:
      - sentinela_network

networks:
  sentinela_network:
    driver: bridge
